<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脊梁 · 猜一猜｜群星脊梁博物馆</title>
<style>
  :root{
    --paper:#EFE9DA;--paper-deep:#E4DCC6;--ink:#2E2921;--ink-soft:#6C6453;
    --cinnabar:#B23A2E;--gold:#A98A4B;
    --serif:"Songti SC","STSong","Noto Serif SC",SimSun,serif;
    --kai:"Kaiti SC","KaiTi","FangSong",serif;
    --sans:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--paper);
    background-image:radial-gradient(120% 90% at 50% -10%,rgba(255,255,255,.55),transparent 60%),radial-gradient(var(--paper-deep) 1px,transparent 1px);
    background-size:100% 100%,28px 28px;
    color:var(--ink);font-family:var(--sans);line-height:1.8;min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 22px}
  .topbar{border-bottom:1px solid rgba(46,41,33,.14);padding:13px 0}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between}
  .topbar a{text-decoration:none;color:var(--ink-soft);font-family:var(--kai);font-size:13px;letter-spacing:1px}
  .topbar a:hover{color:var(--cinnabar)}
  .topbar .brand{display:flex;align-items:center;gap:10px}
  .topbar .seal{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 2px 5px rgba(178,58,46,.3))}
  .topbar b{font-family:var(--serif);font-size:14px;letter-spacing:2px}

  header{text-align:center;padding:38px 0 8px}
  header h1{font-family:var(--serif);font-size:clamp(28px,6vw,42px);letter-spacing:4px}
  header .sub{font-family:var(--kai);font-size:15px;color:var(--ink-soft);letter-spacing:2px;margin-top:8px}

  .hud{display:flex;align-items:center;justify-content:center;gap:24px;margin:24px 0 6px;flex-wrap:wrap}
  .hud .stat{text-align:center}
  .hud .num{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--cinnabar)}
  .hud .lbl{font-family:var(--kai);font-size:12px;color:var(--ink-soft);letter-spacing:2px}
  .hud .progress{flex:1;min-width:120px;max-width:240px;height:8px;background:rgba(46,41,33,.1);border-radius:99px;overflow:hidden}
  .hud .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--cinnabar));border-radius:99px;transition:width .4s ease}

  /* 计时条 */
  .timer{display:flex;align-items:center;gap:10px;margin:14px 0 0}
  .timer .t-bar{flex:1;height:6px;background:rgba(46,41,33,.08);border-radius:99px;overflow:hidden}
  .timer .t-bar i{display:block;height:100%;background:var(--cinnabar);border-radius:99px;width:100%;transition:width .1s linear}
  .timer .t-num{font-family:var(--serif);font-size:16px;color:var(--cinnabar);min-width:34px;text-align:right}
  .timer .t-bar i.warn{background:#D9772E}

  .card{background:#FBF7EC;border:1px solid rgba(46,41,33,.12);border-radius:16px;box-shadow:0 8px 26px rgba(46,41,33,.12);padding:30px 28px;margin-top:18px}
  .q-type{font-family:var(--kai);font-size:13px;color:var(--cinnabar);letter-spacing:3px;margin-bottom:12px}
  .q-clue{font-family:var(--kai);font-size:clamp(17px,3.4vw,21px);line-height:2.05;letter-spacing:1px;color:var(--ink)}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
  .opt{
    cursor:pointer;font-family:var(--serif);font-size:17px;letter-spacing:2px;color:var(--ink);
    background:#fff;border:2px solid rgba(46,41,33,.16);border-radius:11px;padding:15px 12px;text-align:center;
    transition:all .18s ease;position:relative;
  }
  .opt:hover{border-color:var(--cinnabar);color:var(--cinnabar);transform:translateY(-2px)}
  .opt.correct{background:#4C7A52;border-color:#4C7A52;color:#fff;animation:pop .35s ease}
  .opt.wrong{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff}
  .opt.disabled{pointer-events:none;opacity:.55}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}

  /* 答对显示照片 */
  .answer{display:none;margin-top:20px;gap:16px;align-items:center;background:rgba(46,41,33,.04);border-radius:12px;padding:16px}
  .answer.show{display:flex}
  .answer .a-img{width:76px;height:94px;object-fit:cover;border-radius:9px;border:2px solid var(--cinnabar);flex:0 0 76px;background:linear-gradient(135deg,#D9A441,#8C6A3F)}
  .answer .a-txt{font-family:var(--kai);font-size:15px;letter-spacing:1px;color:var(--ink);line-height:1.9}
  .answer .a-txt b{color:var(--cinnabar)}
  .next{display:none;margin:20px auto 0;border:none;background:var(--cinnabar);color:#fff;font-family:var(--kai);font-size:15px;letter-spacing:3px;padding:11px 34px;border-radius:10px;cursor:pointer;box-shadow:0 6px 16px rgba(178,58,46,.3)}
  .next:hover{transform:translateY(-2px)}

  .start{text-align:center;padding:30px 26px}
  .start .big{font-size:52px}
  .start p{font-family:var(--kai);font-size:16px;color:var(--ink-soft);line-height:2.05;margin:14px 0 22px;letter-spacing:1px}
  .start-btn{border:none;background:var(--cinnabar);color:#fff;font-family:var(--kai);font-size:17px;letter-spacing:4px;padding:13px 44px;border-radius:12px;cursor:pointer;box-shadow:0 8px 20px rgba(178,58,46,.34);transition:transform .2s}
  .start-btn:hover{transform:translateY(-3px)}

  .result{text-align:center}
  .result .score{font-family:var(--serif);font-size:64px;font-weight:700;color:var(--cinnabar);line-height:1}
  .result .rate{font-family:var(--kai);font-size:18px;color:var(--ink);margin-top:10px;letter-spacing:2px}
  .result p{font-family:var(--kai);font-size:15px;color:var(--ink-soft);margin:16px 0 24px;letter-spacing:1px}
  .result .btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{border:2px solid var(--cinnabar);background:transparent;color:var(--cinnabar);font-family:var(--kai);font-size:15px;letter-spacing:2px;padding:10px 24px;border-radius:10px;cursor:pointer;text-decoration:none;transition:all .2s}
  .btn.solid{background:var(--cinnabar);color:#fff}
  .btn:hover{transform:translateY(-2px)}

  footer{text-align:center;padding:30px 0 44px;margin-top:30px}
  footer p{font-family:var(--kai);font-size:13px;color:var(--ink-soft);letter-spacing:2px}

  @media (max-width:520px){.options{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

  <div class="topbar">
    <div class="wrap">
      <a href="index.html">← 返回博物馆大厅</a>
      <div class="brand"><img class="seal" src="images/seal.png" alt="馆印"><b>群星脊梁博物馆</b></div>
    </div>
  </div>

  <header class="wrap">
    <h1>脊梁 · 猜一猜</h1>
    <div class="sub">三十位脊梁，三种题型，你能认出几位？</div>
  </header>

  <main class="wrap">

    <div class="card start" id="start">
      <div class="big">🎮</div>
      <p>这里有三十位照亮时代的脊梁。<br>三种题型：看身份、看名言、看高光。<br>每题限时 20 秒，共十题。</p>
      <button class="start-btn" id="start-btn">开始挑战</button>
    </div>

    <div id="quiz" hidden>
      <div class="hud">
        <div class="stat"><div class="num" id="score">0</div><div class="lbl">得分</div></div>
        <div class="stat"><div class="num" id="round">1</div><div class="lbl">题号</div></div>
        <div class="stat"><div class="num" id="streak">0</div><div class="lbl">连对</div></div>
      </div>
      <div class="timer"><span class="lbl" style="font-family:var(--kai);font-size:12px;color:var(--ink-soft);letter-spacing:2px">倒计时</span><div class="t-bar"><i id="tbar"></i></div><span class="t-num" id="tnum">20</span></div>

      <div class="card">
        <div class="q-type" id="qtype"></div>
        <p class="q-clue" id="clue"></p>
        <div class="options" id="options"></div>
        <div class="answer" id="answer">
          <img class="a-img" id="a-img" alt="">
          <div class="a-txt" id="feedback"></div>
        </div>
        <button class="next" id="next">下一题 →</button>
      </div>
    </div>

    <div class="card result" id="result" hidden>
      <div class="q-type">挑战结束</div>
      <div class="score" id="final-score">0</div>
      <div class="rate" id="rate"></div>
      <p id="comment"></p>
      <div class="btn-row">
        <button class="btn solid" id="again">再来一局</button>
        <a class="btn" href="index.html">回到博物馆</a>
      </div>
    </div>

  </main>

  <footer>
    <p>策展小组：Daniel · Rummy · Bohan · Steven</p>
  </footer>

  <script>

      {n:"高凤林",c:"#3E5C76",img:null,clue:"火箭发动机焊接大师，0.08 毫米的精度，被称为“焊接火箭心脏的人”。",quote:"焊缝就是火箭的生命线，容不得一丝瑕疵。",hl:"0.08 毫米精度，焊接火箭发动机喷管",fact:"大国工匠"},
      {n:"钱学森",c:"#2E4A6B",img:"images/portrait-04.jpg",clue:"中国航天之父，五年归国路、十年两弹成，让中国人叩问苍穹。",quote:"科学无国界，科学家有祖国。",hl:"被软禁五年仍坚持回国，主持研制导弹",fact:"科学无国界，科学家有祖国"},

    function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

      document.getElementById('start').hidden = true;
      document.getElementById('result').hidden = true;
      document.getElementById('quiz').hidden = false;
      showQuestion();
    }

    function showQuestion(){
      answered = false;
      var q = questions[idx];
      var type = TYPES[Math.floor(Math.random()*TYPES.length)];
      document.getElementById('round').textContent = (idx+1) + '/' + TOTAL;
      document.getElementById('qtype').textContent = type.label;
      document.getElementById('clue').textContent = type.get(q);
      document.getElementById('answer').classList.remove('show');
      document.getElementById('next').style.display = 'none';
      var opts = shuffle(DATA.filter(function(d){return d.n!==q.n;})).slice(0,3).concat([q]);
      opts = shuffle(opts);
      var box = document.getElementById('options');
      box.innerHTML = '';
      opts.forEach(function(o){
        var b = document.createElement('button');
        b.className = 'opt';
        b.textContent = o.n;
        b.onclick = function(){ answer(o, q, b); };
        box.appendChild(b);
      });
      startTimer();
    }

    function startTimer(){
      timeLeft = SECONDS;
      updateTimer();
      clearInterval(timer);
      timer = setInterval(function(){
        timeLeft -= 0.1;
        if(timeLeft <= 0){ timeLeft = 0; clearInterval(timer); timeout(); }
        updateTimer();
      }, 100);
    }
    function updateTimer(){
      var bar = document.getElementById('tbar');
      var num = document.getElementById('tnum');
      num.textContent = Math.ceil(timeLeft);
      var pct = Math.max(0, timeLeft / SECONDS * 100);
      bar.style.width = pct + '%';
      bar.className = timeLeft <= 5 ? 'warn' : '';
    }

    function reveal(q, pick, correct){
      clearInterval(timer);
      answered = true;
      document.querySelectorAll('.opt').forEach(function(b){
        b.classList.add('disabled');
        if(b.textContent === q.n) b.classList.add('correct');
      });
      if(pick && !correct) pick.classList.add('wrong');
      // 显示照片
      var img = document.getElementById('a-img');
      if(q.img){ img.src = q.img; img.style.display = 'block'; }
      else { img.removeAttribute('src'); img.style.display = 'none'; }
      var fb = document.getElementById('feedback');
      if(correct){ fb.innerHTML = '✓ 答对了！<b>' + q.n + '</b> —— ' + q.fact; }
      else if(pick){ fb.innerHTML = '✗ 是<b>' + q.n + '</b>，而不是' + pick.textContent + '。' + q.n + '：' + q.fact; }
      else { fb.innerHTML = '⏱ 时间到！是<b>' + q.n + '</b>。' + q.n + '：' + q.fact; }
      document.getElementById('answer').classList.add('show');
      document.getElementById('next').style.display = 'block';
      document.getElementById('score').textContent = score;
      document.getElementById('streak').textContent = streak;
    }

    function answer(pick, q, btnEl){
      if(answered) return;
      var correct = pick.n === q.n;
      if(correct){ score++; streak++; if(streak>best) best=streak; }
      else streak = 0;
      reveal(q, btnEl, correct);
    }
    function timeout(){
      if(answered) return;
      reveal(q_cur(), null, false);
    }
    function q_cur(){ return questions[idx]; }

    function next(){
      idx++;
      if(idx >= TOTAL){ endGame(); return; }
      showQuestion();
    }

    function endGame(){
      document.getElementById('quiz').hidden = true;
      var r = document.getElementById('result');
      r.hidden = false;
      document.getElementById('final-score').textContent = score + ' / ' + TOTAL;
      var rate, comment;
      if(score >= 9){ rate = '🌟 脊梁知己'; comment = '你对这些时代脊梁了如指掌，堪称知己！'; }
      else if(score >= 7){ rate = '👍 心领神会'; comment = '你已经很懂他们了，再去展厅里走走吧。'; }
      else if(score >= 5){ rate = '📖 渐入佳境'; comment = '有点感觉了，回博物馆补补课再来！'; }
      else { rate = '🌱 初来乍到'; comment = '没关系，正是认识他们的开始，去展厅看看吧。'; }
      document.getElementById('rate').textContent = rate;
      document.getElementById('comment').textContent = comment;
    }

    document.getElementById('start-btn').onclick = startGame;
    document.getElementById('next').onclick = next;
    document.getElementById('again').onclick = startGame;
  </script>

</body>
</html>
