<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>群星脊梁博物馆 · 3D 展厅</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#14100c;font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block}

  .overlay{position:fixed;inset:0;pointer-events:none;z-index:10}
  .overlay *{pointer-events:auto}

  .brand{position:absolute;top:16px;left:20px;display:flex;align-items:center;gap:11px}
  .brand img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
  .brand .t{color:#F7F2E7;font-family:"Songti SC","STSong",serif;font-size:21px;letter-spacing:3px;text-shadow:0 2px 8px rgba(0,0,0,.7)}
  .brand .s{display:block;color:#CFC6B0;font-family:"Kaiti SC","KaiTi",serif;font-size:12px;letter-spacing:2px}

  .top-actions{position:absolute;top:16px;right:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .btn{border:1px solid rgba(247,242,231,.35);background:rgba(20,16,13,.6);color:#F7F2E7;font-family:"Kaiti SC","KaiTi",serif;font-size:13px;letter-spacing:1px;padding:7px 13px;border-radius:8px;cursor:pointer;backdrop-filter:blur(4px);transition:all .2s;text-decoration:none}
  .btn:hover{background:rgba(178,58,46,.8);border-color:#B23A2E}
  .btn.on{background:rgba(178,58,46,.92);border-color:#B23A2E}

  .door-card{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);text-align:center;background:rgba(20,16,13,.74);border:1px solid rgba(247,242,231,.25);border-radius:16px;padding:26px 40px;backdrop-filter:blur(6px);transition:opacity .6s,transform .6s}
  .door-card .hall{color:#E8C77F;font-family:"Kaiti SC","KaiTi",serif;font-size:14px;letter-spacing:6px;margin-bottom:8px}
  .door-card h1{color:#F7F2E7;font-family:"Songti SC","STSong",serif;font-size:clamp(24px,5vw,38px);letter-spacing:4px;margin-bottom:12px}
  .door-btn{border:none;background:linear-gradient(135deg,#B23A2E,#8C2B22);color:#fff;font-family:"Kaiti SC","KaiTi",serif;font-size:18px;letter-spacing:6px;padding:14px 38px;border-radius:12px;cursor:pointer;box-shadow:0 8px 24px rgba(178,58,46,.45);transition:transform .2s}
  .door-btn:hover{transform:translateY(-3px) scale(1.03)}
  .door-card.hide{opacity:0;transform:translateX(-50%) translateY(30px);pointer-events:none}

  .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#CFC6B0;font-family:"Kaiti SC","KaiTi",serif;font-size:12px;letter-spacing:1px;background:rgba(20,16,13,.55);padding:7px 16px;border-radius:99px;backdrop-filter:blur(4px);white-space:nowrap}

  /* 信息卡 */
  .info-card{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,16,13,.88);border:1px solid rgba(232,199,127,.5);border-radius:12px;padding:14px 22px;backdrop-filter:blur(6px);opacity:0;transition:opacity .25s;text-align:center;min-width:220px}
  .info-card.show{opacity:1}
  .info-card .n{color:#E8C77F;font-family:"Songti SC","STSong",serif;font-size:22px;letter-spacing:3px}
  .info-card .d{color:#CFC6B0;font-family:"Kaiti SC","KaiTi",serif;font-size:14px;letter-spacing:1px;margin-top:4px}
  .info-card .go{color:#F7F2E7;font-family:"Kaiti SC","KaiTi",serif;font-size:12px;letter-spacing:2px;margin-top:6px;opacity:.8}

  /* 名录面板 */
  .roster{position:absolute;top:0;right:0;bottom:0;width:280px;max-width:82vw;background:rgba(20,16,13,.92);backdrop-filter:blur(8px);transform:translateX(100%);transition:transform .35s ease;padding:22px 18px;overflow-y:auto;border-left:1px solid rgba(247,242,231,.15);z-index:20}
  .roster.open{transform:translateX(0)}
  .roster h3{color:#E8C77F;font-family:"Songti SC","STSong",serif;font-size:18px;letter-spacing:3px;margin-bottom:12px}
  .roster .r-close{position:absolute;top:14px;right:14px;background:none;border:none;color:#CFC6B0;font-size:20px;cursor:pointer}
  .roster .r-grid{display:grid;grid-template-columns:1fr;gap:5px}
  .roster a{display:flex;align-items:center;gap:9px;color:#F7F2E7;text-decoration:none;font-family:"Kaiti SC","KaiTi",serif;font-size:15px;letter-spacing:2px;padding:7px 11px;border-radius:8px;transition:background .2s}
  .roster a:hover{background:rgba(178,58,46,.5)}
  .roster a i{width:10px;height:10px;border-radius:50%;flex:0 0 10px;box-shadow:0 0 6px currentColor}

  /* 小地图 */
  .minimap{position:absolute;bottom:14px;right:14px;width:150px;height:110px;border:1px solid rgba(232,199,127,.4);border-radius:8px;background:rgba(20,16,13,.7);backdrop-filter:blur(4px);overflow:hidden}
  .minimap canvas{display:block}

  /* 虚拟摇杆 */
  .joystick{position:absolute;left:24px;bottom:120px;width:120px;height:120px;border-radius:50%;background:rgba(20,16,13,.35);border:1px solid rgba(247,242,231,.25);touch-action:none;display:none}
  .joystick .knob{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;background:rgba(247,242,231,.4);transform:translate(-50%,-50%)}
  body.touch .joystick{display:block}

  /* Loading */
  .loading{position:absolute;inset:0;background:#14100c;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;transition:opacity .6s}
  .loading .seal{width:72px;height:72px;object-fit:contain;margin-bottom:18px;animation:sealpulse 1.6s ease-in-out infinite}
  @keyframes sealpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .loading .bar{width:240px;height:6px;background:rgba(247,242,231,.15);border-radius:99px;overflow:hidden}
  .loading .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#A98A4B,#B23A2E);border-radius:99px;transition:width .3s}
  .loading .txt{color:#CFC6B0;font-family:"Kaiti SC","KaiTi",serif;font-size:13px;letter-spacing:3px;margin-top:14px}
  .loading.hide{opacity:0;pointer-events:none}

  @media (max-width:640px){
    .brand .t{font-size:16px;letter-spacing:2px}
    .door-card{padding:18px 24px;bottom:10%}
    .btn{padding:6px 10px;font-size:12px}
    .hint{display:none}
    .minimap{width:110px;height:84px}
  }
</style>
</head>
<body>
  <div id="stage"></div>

  <div class="overlay">
    <div class="brand">
      <img src="images/seal.png" alt="馆印">
      <div><span class="t">群星脊梁博物馆</span><span class="s">虚拟 3D 展厅</span></div>
    </div>

    <div class="top-actions">
      <button class="btn" id="tour-btn">🎧 自动导览</button>
      <button class="btn" id="walk-btn">🚶 自动漫游</button>
      <button class="btn" id="roster-btn">📋 名录</button>
      <a class="btn" href="game.html">🎮 小游戏</a>
    </div>

    <div class="door-card" id="door-card">
      <div class="hall">时代脊梁 · 群星谱</div>
      <h1>群星脊梁博物馆</h1>
      <button class="door-btn" id="door-btn">🚪 推门进入</button>
    </div>

    <div class="info-card" id="info-card">
      <div class="n" id="info-name"></div>
      <div class="d" id="info-desc"></div>
      <div class="go">点击进入展厅</div>
    </div>

    <div class="hint">拖拽转视角 · W A S D / 方向键移动 · 点击地板前进 · 点击展位进入</div>

    <div class="minimap"><canvas id="minimap" width="150" height="110"></canvas></div>
    <div class="joystick" id="joystick"><div class="knob" id="knob"></div></div>

    <div class="roster" id="roster">
      <button class="r-close" id="r-close">✕</button>
      <h3>人物名录</h3>
      <div class="r-grid" id="r-grid"></div>
    </div>

    <div class="loading" id="loading">
      <img class="seal" src="images/seal.png" alt="">
      <div class="bar"><i id="load-bar"></i></div>
      <div class="txt" id="load-txt">正在布展…</div>
    </div>
  </div>

  <script src="js/three.min.js"></script>
  <script>
  var EXHIBITS = [
    {n:"袁隆平",hall:"稻浪厅",f:"袁隆平.html",c:0xC89B3C,field:"科学",img:"images/portrait-00.jpg",d:"杂交水稻之父"},
    {n:"张秉贵",hall:"团火厅",f:"张秉贵.html",c:0xD9772E,field:"劳模",img:"images/portrait-01.jpg",d:"“一团火”精神"},
    {n:"钟扬",hall:"探界厅",f:"钟扬.html",c:0x4A6FA5,field:"科学",img:null,d:"种子精神"},
    {n:"高凤林",hall:"匠心厅",f:"高凤林.html",c:0x3E5C76,field:"劳模",img:null,d:"大国工匠"},
    {n:"钱学森",hall:"铸剑厅",f:"钱学森.html",c:0x2E4A6B,field:"科学",img:"images/portrait-04.jpg",d:"中国航天之父"},
    {n:"邓稼先",hall:"元勋厅",f:"邓稼先.html",c:0xB57A3A,field:"科学",img:"images/portrait-05.jpg",d:"两弹元勋"},
    {n:"屠呦呦",hall:"青蒿厅",f:"屠呦呦.html",c:0x5E8C5A,field:"科学",img:"images/portrait-06.jpg",d:"青蒿济世"},
    {n:"南仁东",hall:"天眼厅",f:"南仁东.html",c:0x33505A,field:"科学",img:null,d:"天眼问天"},
    {n:"华罗庚",hall:"数魂厅",f:"华罗庚.html",c:0x3F6E8E,field:"科学",img:"images/portrait-08.jpg",d:"自学成才"},
    {n:"李四光",hall:"寻矿厅",f:"李四光.html",c:0xA98A4B,field:"科学",img:"images/portrait-09.jpg",d:"地质报国"},
    {n:"茅以升",hall:"架桥厅",f:"茅以升.html",c:0x4A6B82,field:"科学",img:"images/portrait-10.jpg",d:"中国桥梁之父"},
    {n:"于敏",hall:"铸盾厅",f:"于敏.html",c:0x6E5B3A,field:"科学",img:"images/portrait-11.jpg",d:"氢弹之父"},
    {n:"孙家栋",hall:"北斗厅",f:"孙家栋.html",c:0x4A90A5,field:"科学",img:"images/portrait-12.jpg",d:"卫星总师"},
    {n:"王进喜",hall:"铁人厅",f:"王进喜.html",c:0xA8743A,field:"劳模",img:"images/portrait-13.jpg",d:"大庆铁人"},
    {n:"时传祥",hall:"净城厅",f:"时传祥.html",c:0x5C7A4A,field:"劳模",img:"images/portrait-14.jpg",d:"一人脏万家净"},
    {n:"许振超",hall:"振超厅",f:"许振超.html",c:0x3E6E8E,field:"劳模",img:null,d:"振超效率"},
    {n:"焦裕禄",hall:"焦桐厅",f:"焦裕禄.html",c:0x4C7A52,field:"楷模",img:"images/portrait-16.jpg",d:"生也沙丘死也沙丘"},
    {n:"雷锋",hall:"雷锋精神厅",f:"雷锋.html",c:0x4C6E3A,field:"楷模",img:"images/portrait-17.jpg",d:"螺丝钉精神"},
    {n:"张桂梅",hall:"燃灯厅",f:"张桂梅.html",c:0xB54A5E,field:"楷模",img:"images/portrait-18.jpg",d:"燃灯校长"},
    {n:"黄文秀",hall:"青春厅",f:"黄文秀.html",c:0xC0603A,field:"楷模",img:"images/portrait-19.jpg",d:"青春奉献"},
    {n:"黄大年",hall:"归国厅",f:"黄大年.html",c:0x3A5A8A,field:"科学",img:"images/portrait-20.jpg",d:"心有大我"},
    {n:"申纪兰",hall:"纪兰厅",f:"申纪兰.html",c:0x9E4A3A,field:"楷模",img:"images/portrait-21.jpg",d:"同工同酬"},
    {n:"王继才",hall:"守岛厅",f:"王继才.html",c:0x4A7A8A,field:"楷模",img:null,d:"守岛就是守国"},
    {n:"鲁迅",hall:"呐喊厅",f:"鲁迅.html",c:0x4A4438,field:"文人",img:"images/portrait-23.jpg",d:"民族脊梁"},
    {n:"闻一多",hall:"红烛厅",f:"闻一多.html",c:0x8C3A3A,field:"文人",img:"images/portrait-24.jpg",d:"拍案而起"},
    {n:"朱自清",hall:"背影厅",f:"朱自清.html",c:0x4C8C6E,field:"文人",img:"images/portrait-25.jpg",d:"宁死不食"},
    {n:"老舍",hall:"茶馆厅",f:"老舍.html",c:0x5A5A6E,field:"文人",img:"images/portrait-26.jpg",d:"人民艺术家"},
    {n:"吴孟超",hall:"妙手厅",f:"吴孟超.html",c:0xB08C3A,field:"医者",img:"images/portrait-27.jpg",d:"医者仁心"},
    {n:"林巧稚",hall:"新生厅",f:"林巧稚.html",c:0xB56A7E,field:"医者",img:"images/portrait-28.jpg",d:"万婴之母"},
    {n:"詹天佑",hall:"京张厅",f:"詹天佑.html",c:0x4C7A6E,field:"科学",img:"images/portrait-29.jpg",d:"人字铁路"}
  ];

  var W=40,H=12,D=26;
  var scene=new THREE.Scene();
  scene.background=new THREE.Color(0x191410);
  scene.fog=new THREE.Fog(0x191410,20,58);
  var camera=new THREE.PerspectiveCamera(68,window.innerWidth/window.innerHeight,0.1,200);
  camera.position.set(0,5.2,-19); camera.rotation.order='YXZ'; camera.rotation.y=Math.PI;
  var renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  document.getElementById('stage').appendChild(renderer.domElement);

  // ————— 灯光 —————
  scene.add(new THREE.AmbientLight(0x3a3226,0.9));
  scene.add(new THREE.HemisphereLight(0xfff2dc,0x241d17,0.5));
  var keyLight=new THREE.PointLight(0xffe0b0,1.4,50,2); keyLight.position.set(0,11,0); keyLight.castShadow=true; scene.add(keyLight);

  // ————— 程序材质 —————
  function tex(cb){ var c=document.createElement('canvas'); c.width=c.height=512; cb(c.getContext('2d'),512); var t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t; }
  var floorTex=tex(function(g,s){
    g.fillStyle='#3a2c1c'; g.fillRect(0,0,s,s);
    for(var y=0;y<s;y+=64){ for(var x=0;x<s;x+=64){ g.fillStyle=(x+y)%128?'#41311f':'#382a1a'; g.fillRect(x,y,64,64); } }
    g.strokeStyle='rgba(0,0,0,.25)'; g.lineWidth=2;
    for(var i=0;i<s;i+=64){ g.beginPath(); g.moveTo(0,i); g.lineTo(s,i); g.stroke(); g.beginPath(); g.moveTo(i,0); g.lineTo(i,s); g.stroke(); }
  });
  floorTex.repeat.set(6,4);
  var wallTex=tex(function(g,s){
    g.fillStyle='#e6d9bc'; g.fillRect(0,0,s,s);
    g.fillStyle='rgba(0,0,0,.03)'; for(var i=0;i<400;i++){ g.fillRect(Math.random()*s,Math.random()*s,3,3); }
    g.fillStyle='#b89a6a'; g.fillRect(0,s-24,s,24); g.fillStyle='#a68a5e'; g.fillRect(0,s-24,s,3);
  });
  var ceilTex=tex(function(g,s){
    g.fillStyle='#d8cbb0'; g.fillRect(0,0,s,s);
    g.strokeStyle='#b09a76'; g.lineWidth=5;
    for(var i=0;i<=s;i+=128){ g.beginPath(); g.moveTo(0,i); g.lineTo(s,i); g.stroke(); g.beginPath(); g.moveTo(i,0); g.lineTo(i,s); g.stroke(); }
  });
  ceilTex.repeat.set(4,3);
  function backTex(base){
    return tex(function(g,s){
      var c=new THREE.Color(base); g.fillStyle='#'+c.getHexString(); g.fillRect(0,0,s,s);
      var grd=g.createRadialGradient(s/2,s/2,10,s/2,s/2,s/1.5); grd.addColorStop(0,'rgba(255,255,255,.12)'); grd.addColorStop(1,'rgba(0,0,0,.35)');
      g.fillStyle=grd; g.fillRect(0,0,s,s);
    });
  }
  var FIELD_BASE={'科学':0x1d2c3a,'文人':0x2a2620,'劳模':0x3a2a1e,'楷模':0x2a3522,'医者':0x3a2e28};
  var fieldBack={};
  Object.keys(FIELD_BASE).forEach(function(k){ fieldBack[k]=backTex(FIELD_BASE[k]); });

  // ————— 地板 / 天花 / 墙 —————
  var floor=new THREE.Mesh(new THREE.PlaneGeometry(W,D), new THREE.MeshStandardMaterial({map:floorTex,roughness:0.25,metalness:0.4}));
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
  var ceil=new THREE.Mesh(new THREE.PlaneGeometry(W,D), new THREE.MeshStandardMaterial({map:ceilTex,roughness:0.9}));
  ceil.rotation.x=Math.PI/2; ceil.position.y=H; scene.add(ceil);
  var wallMat=new THREE.MeshStandardMaterial({map:wallTex,roughness:0.8});
  function wall(w,h,x,y,z,ry){ var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),wallMat); m.position.set(x,y,z); m.rotation.y=ry; m.receiveShadow=true; scene.add(m); return m; }
  wall(W,H,0,H/2,-D/2,0); wall(W,H,0,H/2,D/2,Math.PI); wall(D,H,-W/2,H/2,0,Math.PI/2); wall(D,H,W/2,H/2,0,-Math.PI/2);

  // 天窗（主厅上方玻璃）
  var sky=new THREE.Mesh(new THREE.PlaneGeometry(8,6), new THREE.MeshBasicMaterial({color:0xfff6e0,transparent:true,opacity:0.9}));
  sky.rotation.x=Math.PI/2; sky.position.set(0,H-0.05,0); scene.add(sky);

  // 柱子
  var colGeo=new THREE.BoxGeometry(1.1,H,1.1);
  var colMat=new THREE.MeshStandardMaterial({color:0xd8cbb0,roughness:0.6});
  [[-10,6],[10,6],[-10,-6],[10,-6]].forEach(function(p){
    var col=new THREE.Mesh(colGeo,colMat); col.position.set(p[0],H/2,p[1]); col.castShadow=true; col.receiveShadow=true; scene.add(col);
  });

  // ————— 脊梁之柱（中央光柱）—————
  var pillar=new THREE.Group();
  var core=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.7,10,24), new THREE.MeshStandardMaterial({color:0x8c6a3f,roughness:0.4,metalness:0.6,emissive:0x2a1f10}));
  core.position.y=5; core.castShadow=true; pillar.add(core);
  var glow=new THREE.Mesh(new THREE.CylinderGeometry(1.8,2.1,10,24), new THREE.MeshBasicMaterial({color:0xffd9a0,transparent:true,opacity:0.12,side:THREE.BackSide}));
  glow.position.y=5; pillar.add(glow);
  // 柱顶光环
  var ring=new THREE.Mesh(new THREE.TorusGeometry(2.6,0.12,12,48), new THREE.MeshBasicMaterial({color:0xffd9a0}));
  ring.rotation.x=Math.PI/2; ring.position.y=10.4; pillar.add(ring);
  pillar.position.set(0,0,3); scene.add(pillar);

  // ————— 金色动线 —————
  function guideLine(pts){
    var curve=new THREE.CatmullRomCurve3(pts);
    var g=new THREE.TubeGeometry(curve, 100, 0.08, 8, false);
    var m=new THREE.Mesh(g, new THREE.MeshBasicMaterial({color:0xd9a441,transparent:true,opacity:0.7}));
    m.position.y=0.03; scene.add(m);
  }
  guideLine([new THREE.Vector3(0,0,-12), new THREE.Vector3(0,0,-6), new THREE.Vector3(0,0,4), new THREE.Vector3(0,0,12)]);

  // ————— 展位 —————
  var texLoader=new THREE.TextureLoader(); texLoader.crossOrigin='';
  // 用原生 Image 加载（file:// 下不触发 CORS，双击可离线打开）
  function loadTex(src, cb){
    var img=new Image();
    img.onload=function(){ var t=new THREE.Texture(img); t.needsUpdate=true; t.minFilter=THREE.LinearFilter; cb(t,img); };
    img.onerror=function(){ cb(null,null); };
    img.src=src;
  }
  var totalLoad=0, loadedCount=0;
  EXHIBITS.forEach(function(d){ if(d.img) totalLoad++; });
  function onLoad(){ loadedCount++; var p=Math.min(100, Math.round(loadedCount/totalLoad*100)); document.getElementById('load-bar').style.width=p+'%'; if(p>=100) setTimeout(hideLoading,400); }
  function hideLoading(){ document.getElementById('loading').classList.add('hide'); }

  function makeLabel(name, hall, colorHex){
    var c=document.createElement('canvas'); c.width=512; c.height=160;
    var g=c.getContext('2d'); g.clearRect(0,0,512,160);
    g.fillStyle='#'+colorHex.toString(16).padStart(6,'0');
    g.font='bold 68px "Songti SC","STSong",serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(name, 256, 62);
    g.fillStyle='#e8dcbe'; g.font='34px "Kaiti SC","KaiTi",serif';
    g.fillText(hall, 256, 126);
    var t=new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter; return t;
  }
  function makePortraitTex(d, portraitMesh, frameMat){
    // 缺图：用人物色 + 姓氏大字占位
    var c=document.createElement('canvas'); c.width=256; c.height=320;
    var g=c.getContext('2d');
    g.fillStyle='#'+d.c.toString(16).padStart(6,'0'); g.fillRect(0,0,256,320);
    g.fillStyle='rgba(0,0,0,.15)'; g.fillRect(0,0,256,320);
    g.fillStyle='#fff'; g.font='bold 130px "Songti SC","STSong",serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(d.n.charAt(0), 128, 160);
    var t=new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter;
    portraitMesh.material=new THREE.MeshStandardMaterial({map:t,roughness:0.55});
    if(d.img){ loadTex(d.img, function(tex){ if(!tex) return; onLoad(); var iw=tex.image.width||1, ih=tex.image.height||1, a=iw/ih, fa=1.5/2.0; var sx=a>fa?1:a/fa, sy=a>fa?fa/a:1; portraitMesh.scale.set(sx,sy,1); portraitMesh.material=new THREE.MeshStandardMaterial({map:tex,roughness:0.5}); }); }
  }
  function makeExhibit(d){
    var grp=new THREE.Group();
    var frame=new THREE.Mesh(new THREE.PlaneGeometry(1.9,2.5), new THREE.MeshStandardMaterial({color:d.c,roughness:0.4,metalness:0.15}));
    grp.add(frame);
    var portrait=new THREE.Mesh(new THREE.PlaneGeometry(1.5,2.0), new THREE.MeshStandardMaterial({color:d.c}));
    portrait.position.z=0.03; grp.add(portrait);
    makePortraitTex(d, portrait, frame.material);
    // 玻璃罩
    var glass=new THREE.Mesh(new THREE.PlaneGeometry(1.5,2.0), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.06}));
    glass.position.z=0.1; grp.add(glass);
    // 大名牌
    var plaque=new THREE.Mesh(new THREE.PlaneGeometry(2.0,0.62), new THREE.MeshStandardMaterial({color:0x1d1813,roughness:0.5}));
    plaque.position.set(0,-1.58,0.02); grp.add(plaque);
    var label=new THREE.Mesh(new THREE.PlaneGeometry(2.0,0.62), new THREE.MeshBasicMaterial({map:makeLabel(d.n,d.hall,d.c),transparent:true}));
    label.position.set(0,-1.58,0.06); grp.add(label);
    grp.userData=d;
    return grp;
  }

  // 分区布展：按领域分组挂墙
  var groups={'科学':[],'文人':[],'劳模':[],'楷模':[],'医者':[]};
  EXHIBITS.forEach(function(d){ groups[d.field].push(d); });
  var exhibits=[];
  function placeWall(list, x, z0, dz, ry){
    list.forEach(function(d,i){
      var e=makeExhibit(d);
      e.position.set(x, 3.9, z0 + i*dz);
      e.rotation.y=ry;
      scene.add(e); exhibits.push(e);
    });
  }
  function placeWallX(list, z, x0, dx, ry){
    list.forEach(function(d,i){
      var e=makeExhibit(d);
      e.position.set(x0 + i*dx, 3.9, z);
      e.rotation.y=ry;
      scene.add(e); exhibits.push(e);
    });
  }
  // 后墙：科学(13) —— 沿 X 分布
  placeWallX(groups['科学'], D/2-0.35, -17.4, 2.9, Math.PI);
  // 左墙前：文人(4)
  placeWall(groups['文人'], -W/2+0.4, -10.5, 2.6, Math.PI/2);
  // 左墙后：楷模(6)
  placeWall(groups['楷模'], -W/2+0.4, 0.5, 2.2, Math.PI/2);
  // 右墙后：劳模(5)
  placeWall(groups['劳模'], W/2-0.4, 0.5, 2.6, -Math.PI/2);
  // 右墙前：医者(2)
  placeWall(groups['医者'], W/2-0.4, -9.5, 2.6, -Math.PI/2);

  // 领域主题背板 + 标题
  function zoneTitle(text, x, y, z, ry){
    var t=new THREE.Mesh(new THREE.PlaneGeometry(4,1.2), new THREE.MeshBasicMaterial({map:makeLabel(text,'',0xE8C77F),transparent:true}));
    t.position.set(x,y,z); t.rotation.y=ry; scene.add(t);
  }
  zoneTitle('科学家', 0, 8.6, D/2-0.3, Math.PI);
  zoneTitle('文人风骨', -W/2+0.4, 8.6, -6.5, Math.PI/2);
  zoneTitle('楷模脊梁', -W/2+0.4, 8.6, 6, Math.PI/2);
  zoneTitle('劳模工匠', W/2-0.4, 8.6, 6, -Math.PI/2);
  zoneTitle('医者仁心', W/2-0.4, 8.6, -8, -Math.PI/2);

  // ————— 全息展台（4 位重点人物）—————
  var holoGroup=[];
  function holoPedestal(d, x, z){
    var g=new THREE.Group();
    var base=new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.9,1.0,24), new THREE.MeshStandardMaterial({color:0x8c6a3f,roughness:0.3,metalness:0.6}));
    base.position.y=0.5; base.castShadow=true; g.add(base);
    var disc=new THREE.Mesh(new THREE.CylinderGeometry(0.65,0.65,0.1,24), new THREE.MeshBasicMaterial({color:0xffd9a0,transparent:true,opacity:0.5}));
    disc.position.y=1.05; g.add(disc);
    var hp=new THREE.Mesh(new THREE.PlaneGeometry(1.4,1.8), new THREE.MeshBasicMaterial({color:d.c,transparent:true,opacity:0.85}));
    hp.position.y=2.2; g.add(hp);
    if(d.img){ loadTex(d.img, function(tex){ if(!tex) return; onLoad(); hp.material=new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:0.9}); }); }
    var ring=new THREE.Mesh(new THREE.TorusGeometry(0.8,0.05,8,32), new THREE.MeshBasicMaterial({color:d.c}));
    ring.rotation.x=Math.PI/2; ring.position.y=0.05; g.add(ring);
    g.position.set(x,0,z); g.userData=d; scene.add(g); holoGroup.push({g:g,hp:hp,d:d});
  }
  var holos={};
  ['袁隆平','钱学森','鲁迅','张桂梅'].forEach(function(n){ var d=EXHIBITS.find(function(e){return e.n===n;}); holos[n]=d; });
  holoPedestal(holos['袁隆平'], -6, 6);
  holoPedestal(holos['钱学森'], 6, 6);
  holoPedestal(holos['鲁迅'], -6, 0);
  holoPedestal(holos['张桂梅'], 6, 0);

  // ————— 体积光（锥形光柱）—————
  var shafts=[];
  function lightShaft(x,y,z){
    var cone=new THREE.Mesh(new THREE.ConeGeometry(2.4, 7, 20, 1, true), new THREE.MeshBasicMaterial({color:0xfff2d0,transparent:true,opacity:0.05,depthWrite:false,side:THREE.DoubleSide}));
    cone.position.set(x,y,z); scene.add(cone); shafts.push(cone);
  }
  lightShaft(0,8,0);
  lightShaft(-10,8,4);
  lightShaft(10,8,4);

  // ————— 尘埃粒子 —————
  var dustGeo=new THREE.BufferGeometry();
  var dustN=240, dustPos=new Float32Array(dustN*3);
  for(var i=0;i<dustN;i++){ dustPos[i*3]=(Math.random()-0.5)*W; dustPos[i*3+1]=Math.random()*H; dustPos[i*3+2]=(Math.random()-0.5)*D; }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos,3));
  var dustTex=tex(function(g,s){ var grd=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2); grd.addColorStop(0,'rgba(255,255,255,.9)'); grd.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=grd; g.fillRect(0,0,s,s); });
  var dust=new THREE.Points(dustGeo, new THREE.PointsMaterial({map:dustTex,size:0.09,transparent:true,opacity:0.6,depthWrite:false,blending:THREE.AdditiveBlending}));
  scene.add(dust);

  // 地板倒影：用高光木地板（roughness低 metalness中）营造抛光倒影质感

  // ————— 门 —————
  var doorGroup=new THREE.Group();
  var doorMat=new THREE.MeshStandardMaterial({color:0x6b3a24,roughness:0.5});
  function doorPanel(w,h,hx){ var g=new THREE.Group(); var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.16),doorMat); m.position.x=hx<0?w/2:-w/2; m.castShadow=true; g.add(m); g.position.set(hx,2.2,-D/2+0.1); return g; }
  var doorL=doorPanel(2.4,4.4,-2.4), doorR=doorPanel(2.4,4.4,2.4);
  var fm=new THREE.MeshStandardMaterial({color:0x8c6a3f});
  [[0,4.7,5.2,0.5],[-2.65,2.35,0.5,4.7],[2.65,2.35,0.5,4.7]].forEach(function(p){ var f=new THREE.Mesh(new THREE.BoxGeometry(p[2],p[3],0.3),fm); f.position.set(p[0],p[1],-D/2); doorGroup.add(f); });
  doorGroup.add(doorL,doorR); scene.add(doorGroup);

  // ————— 交互 —————
  var raycaster=new THREE.Raycaster(); var mouse=new THREE.Vector2();
  var yaw=Math.PI,pitch=0,keys={},entered=false,entering=false,doorOpen=0,camT=0;
  var walkTarget=null, autoWalk=false, tourMode=false;
  var hovered=null;

  function isExhibit(o){ return o && o.userData && o.userData.n; }
  function pick(e){
    mouse.x=(e.clientX/window.innerWidth)*2-1; mouse.y=-(e.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse,camera);
    return raycaster.intersectObjects(exhibits,true);
  }
  function onPointerDown(e){
    var x0=e.clientX,y0=e.clientY;
    function move(ev){ var dx=ev.clientX-x0,dy=ev.clientY-y0; yaw-=dx*0.0032; pitch-=dy*0.0032; pitch=Math.max(-1.3,Math.min(1.3,pitch)); x0=ev.clientX;y0=ev.clientY; }
    function up(ev){
      window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up);
      if(Math.hypot(ev.clientX-e.clientX,ev.clientY-e.clientY)<6) onClick(ev);
    }
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  }
  function onClick(e){
    var hits=pick(e);
    if(hits.length){ var d=hits[0].object.parent.userData; if(d&&d.f) location.href=d.f; return; }
    // 点击地板 → 寻路
    mouse.x=(e.clientX/window.innerWidth)*2-1; mouse.y=-(e.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse,camera);
    var fh=raycaster.intersectObject(floor);
    if(fh.length){ var p=fh[0].point; var dx=p.x-pillar.position.x, dz=p.z-pillar.position.z; if(Math.hypot(dx,dz)>2.2) walkTarget=new THREE.Vector3(p.x,5.2,p.z); }
  }
  function onMove(e){
    var hits=pick(e);
    var cur=hits.length?hits[0].object.parent:null;
    if(cur!==hovered){ if(hovered) hovered.scale.setScalar(1); hovered=cur; if(hovered) hovered.scale.setScalar(1.06); renderer.domElement.style.cursor=hovered?'pointer':'grab'; }
    var info=document.getElementById('info-card');
    if(hovered){ document.getElementById('info-name').textContent=hovered.userData.n; document.getElementById('info-desc').textContent=hovered.userData.d+' · '+hovered.userData.hall; info.classList.add('show'); }
    else info.classList.remove('show');
  }
  window.addEventListener('pointerdown',onPointerDown);
  window.addEventListener('pointermove',onMove);
  window.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;});
  window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
  window.addEventListener('wheel',function(e){ if(!entered)return; var f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)); camera.position.add(f.multiplyScalar(-e.deltaY*0.04)); clampCam(); },{passive:true});
  function clampCam(){ camera.position.x=Math.max(-W/2+0.8,Math.min(W/2-0.8,camera.position.x)); camera.position.z=Math.max(-D/2+0.8,Math.min(D/2-0.8,camera.position.z)); }
  document.getElementById('door-btn').onclick=function(){ if(entering)return; entering=true; document.getElementById('door-card').classList.add('hide'); };
  document.getElementById('walk-btn').onclick=function(){ autoWalk=!autoWalk; this.classList.toggle('on',autoWalk); this.textContent=autoWalk?'⏹ 停止漫游':'🚶 自动漫游'; };
  document.getElementById('tour-btn').onclick=function(){ tourMode=!tourMode; this.classList.toggle('on',tourMode); tourIdx=0; this.textContent=tourMode?'⏭ 跳过导览':'🎧 自动导览'; };

  // 导览路径（重点展位）
  var tourPts=[new THREE.Vector3(0,5.2,0), new THREE.Vector3(-6,5.2,6), new THREE.Vector3(6,5.2,6), new THREE.Vector3(-6,5.2,0), new THREE.Vector3(6,5.2,0), new THREE.Vector3(0,5.2,8)];
  var tourIdx=0;
  function tourMove(dt){
    if(tourIdx>=tourPts.length){ tourMode=false; document.getElementById('tour-btn').classList.remove('on'); document.getElementById('tour-btn').textContent='🎧 自动导览'; return; }
    var t=tourPts[tourIdx];
    var v=t.clone().sub(camera.position); v.y=0;
    if(v.length()<0.6){ tourIdx++; return; }
    v.normalize().multiplyScalar(4.5*dt); camera.position.add(v);
    var targetYaw=Math.atan2(-(t.x-camera.position.x), -(t.z-camera.position.z));
    var dy=targetYaw-yaw; while(dy>Math.PI)dy-=2*Math.PI; while(dy<-Math.PI)dy+=2*Math.PI; yaw+=dy*Math.min(1,dt*3);
  }

  // ————— 摇杆 —————
  var joy={x:0,y:0};
  var js=document.getElementById('joystick'), knob=document.getElementById('knob');
  if('ontouchstart' in window) document.body.classList.add('touch');
  js.addEventListener('pointerdown',function(e){ js.setPointerCapture(e.pointerId); });
  js.addEventListener('pointermove',function(e){
    if(e.buttons!==1) return;
    var r=js.getBoundingClientRect(); var cx=r.left+r.width/2, cy=r.top+r.height/2;
    var dx=(e.clientX-cx)/(r.width/2), dy=(e.clientY-cy)/(r.height/2);
    var d=Math.hypot(dx,dy); if(d>1){dx/=d;dy/=d;}
    joy.x=dx; joy.y=dy; knob.style.transform='translate(calc(-50% + '+(dx*38)+'px), calc(-50% + '+(dy*38)+'px))';
  });
  js.addEventListener('pointerup',function(){ joy.x=joy.y=0; knob.style.transform='translate(-50%,-50%)'; });

  // ————— 小地图 —————
  var mapCv=document.getElementById('minimap'), mapCtx=mapCv.getContext('2d');
  function drawMap(){
    mapCtx.clearRect(0,0,150,110);
    mapCtx.fillStyle='rgba(20,16,13,.6)'; mapCtx.fillRect(0,0,150,110);
    var sx=150/W, sy=110/D, ox=75, oy=55;
    function px(x,z){ return [ox+x*sx, oy+z*sy]; }
    mapCtx.strokeStyle='rgba(232,199,127,.6)'; mapCtx.strokeRect(ox-W/2*sx,oy-D/2*sy,W*sx,D*sy);
    mapCtx.fillStyle='rgba(232,199,127,.8)'; var cp=px(pillar.position.x,pillar.position.z); mapCtx.beginPath(); mapCtx.arc(cp[0],cp[1],4,0,7); mapCtx.fill();
    exhibits.forEach(function(e){ var p=px(e.position.x,e.position.z); mapCtx.fillStyle='#'+e.userData.c.toString(16).padStart(6,'0'); mapCtx.fillRect(p[0]-1.5,p[1]-1.5,3,3); });
    var pp=px(camera.position.x,camera.position.z); mapCtx.fillStyle='#fff'; mapCtx.beginPath(); mapCtx.arc(pp[0],pp[1],3.5,0,7); mapCtx.fill();
  }

  // ————— 主循环 —————
  var clock=new THREE.Clock();
  function ease(t){ return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }
  function animate(){
    requestAnimationFrame(animate);
    var dt=Math.min(clock.getDelta(),0.05);
    var t=clock.elapsedTime;

    if(entering){
      doorOpen=Math.min(1,doorOpen+dt*0.8);
      doorL.rotation.y=-1.55*ease(doorOpen); doorR.rotation.y=1.55*ease(doorOpen);
      camT+=dt*0.5; camera.position.z=-19+camT*11; camera.position.y=5.2; camera.rotation.y=Math.PI;
      if(camT>=1){ entering=false; entered=true; }
    } else if(entered){
      if(tourMode){ tourMove(dt); }
      else {
        var sp=7.5*dt;
        var fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
        var right=new THREE.Vector3(-fwd.z,0,fwd.x);
        var mv=new THREE.Vector3();
        if(keys['w']||keys['arrowup'])mv.add(fwd);
        if(keys['s']||keys['arrowdown'])mv.sub(fwd);
        if(keys['a']||keys['arrowleft'])mv.sub(right);
        if(keys['d']||keys['arrowright'])mv.add(right);
        if(joy.x||joy.y)mv.add(new THREE.Vector3(right.x*joy.x+fwd.x*(-joy.y),0,right.z*joy.x+fwd.z*(-joy.y)));
        if(autoWalk){ var af=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)); mv.add(af.multiplyScalar(0.55)); if(Math.abs(camera.position.x)>W/2-1.4||Math.abs(camera.position.z)>D/2-1.4)yaw+=0.9; }
        if(mv.lengthSq()>0){ mv.normalize().multiplyScalar(sp); camera.position.add(mv); walkTarget=null; }
        if(walkTarget){ var wv=walkTarget.clone().sub(camera.position); wv.y=0; if(wv.length()<0.5)walkTarget=null; else { wv.normalize().multiplyScalar(sp*0.8); camera.position.add(wv); var ty=Math.atan2(-(walkTarget.x-camera.position.x),-(walkTarget.z-camera.position.z)); var dyy=ty-yaw; while(dyy>Math.PI)dyy-=2*Math.PI; while(dyy<-Math.PI)dyy+=2*Math.PI; yaw+=dyy*Math.min(1,dt*4);} }
        clampCam();
        camera.rotation.y=yaw; camera.rotation.x=pitch;
      }
    }

    // 展位轻浮动效 + 悬浮
    exhibits.forEach(function(e,i){ e.position.y=3.9+Math.sin(t*1.2+i)*0.05; });
    holoGroup.forEach(function(h){ h.hp.rotation.y=t*0.8; h.hp.position.y=2.2+Math.sin(t*1.5)*0.08; });
    pillar.children[2].rotation.y=t*0.5; // 光环旋转
    pillar.children[1].material.opacity=0.1+Math.sin(t*2)*0.03;
    // 尘埃飘浮
    var dp=dust.geometry.attributes.position.array;
    for(var i=0;i<dustN;i++){ dp[i*3+1]+=Math.sin(t*0.3+i)*0.0015; if(dp[i*3+1]>H)dp[i*3+1]=0; if(dp[i*3+1]<0)dp[i*3+1]=H; }
    dust.geometry.attributes.position.needsUpdate=true;
    dust.rotation.y=t*0.02;
    shafts.forEach(function(s,i){ s.material.opacity=0.04+Math.sin(t*1.5+i)*0.015; });

    drawMap();
    renderer.render(scene,camera);
  }
  animate();
  window.addEventListener('resize',function(){ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });

  // ————— 名录 —————
  var grid=document.getElementById('r-grid');
  EXHIBITS.forEach(function(d){ var a=document.createElement('a'); a.href=d.f; var col='#'+d.c.toString(16).padStart(6,'0'); a.innerHTML='<i style="background:'+col+';color:'+col+'"></i>'+d.n+'<span style="margin-left:auto;color:#CFC6B0;font-size:12px">'+d.hall+'</span>'; grid.appendChild(a); });
  document.getElementById('roster-btn').onclick=function(){ document.getElementById('roster').classList.add('open'); };
  document.getElementById('r-close').onclick=function(){ document.getElementById('roster').classList.remove('open'); };

  // 预加载完成兜底
  if(totalLoad===0) setTimeout(hideLoading,600);
  setTimeout(hideLoading, 4000); // 超时强制显示
  window.addEventListener('pointerdown', hideLoading, {once:true});
  window.addEventListener('keydown', hideLoading, {once:true});
  </script>
</body>
</html>
